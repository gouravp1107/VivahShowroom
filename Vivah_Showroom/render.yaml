# Render Blueprint for the Vivah Showroom monorepo.
# The web service uses backend/ as its root directory. PostgreSQL is now the
# ONE database for the whole app (users, products, orders, inventory — see
# backend/prisma/schema.prisma) — MongoDB is no longer used anywhere.
services:
  - type: web
    name: vivah-showroom-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    initialDeployHook: npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vivah-showroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: ADMIN_SESSION_HOURS
        value: 12
      - key: ADMIN_PHONE_NUMBER
        sync: false
      - key: ADMIN_OWNER_EMAIL
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: vivah-showroom-db
    plan: free
    databaseName: vivah_showroom
    user: vivah_showroom_user
    region: oregon
    postgresMajorVersion: "18"
