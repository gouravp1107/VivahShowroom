<!--
  index.html — the single real HTML page of this entire site (it's a
  React Single Page Application: every "page" you see, like /category/... or
  /product/..., is actually just JavaScript swapping content inside the
  <div id="root"> below — see src/main.jsx and src/App.jsx for how that works).

  Vite reads THIS file as the entry point for both `npm run dev` and
  `npm run build`. In dev mode, the <script> tag below loads
  src/main.jsx directly; in a production build, Vite replaces that tag
  with the compiled/bundled app (and, per vite.config.js's
  vite-plugin-singlefile setup, inlines everything into this file so it
  can be opened straight from disk).
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vivah-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vivah Trousseau — a premium Indian wedding rental showroom for bridal lehengas, sherwanis, jewellery and every occasion look, without the price of ownership." />
    <title>Vivah Trousseau | Indian Wedding Rental Showroom</title>
    <!-- Google Fonts used across the site's design system (see src/index.css's
         @theme block for how Cinzel/Cormorant Garamond/Manrope map to
         font-label/font-display/font-body Tailwind classes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- React takes over this empty div entirely — see src/main.jsx's
         createRoot(document.getElementById('root')) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
